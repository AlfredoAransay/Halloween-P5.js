      </div>
      <p id="cargandoTexto">Preparando la experiencia terrorífica...</p>
      <!-- Logotipo de HealthySmile -->
      <div class="logotipo">
        <img src="images/HealthySmile.png" alt="Logotipo HealthySmile">
